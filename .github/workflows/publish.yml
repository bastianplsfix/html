name: Publish to JSR

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest
          cache: true

      - name: Install locked dependencies
        run: deno ci

      - name: Check package and documentation
        run: deno task check

      - name: Install example dependencies
        run: deno ci
        working-directory: examples/hello

      - name: Check published-package example
        run: deno task check
        working-directory: examples/hello

      - name: Verify tag matches package version
        run: deno run --allow-read --allow-env .github/scripts/release.ts verify

      - name: Verify publish contents and JSR requirements
        run: deno publish --dry-run

      - name: Publish package
        run: deno publish

      - name: Extract changelog release notes
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: >-
          deno run --allow-read --allow-write=${{ runner.temp }} --allow-env
          .github/scripts/release.ts notes

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file "$RELEASE_NOTES_PATH"
