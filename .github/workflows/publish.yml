name: Publish to JSR

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install locked dependencies
        run: deno ci

      - name: Check package and documentation
        run: deno task check

      - name: Install example dependencies
        run: deno ci
        working-directory: examples/hello

      - name: Check published-package example
        run: deno task check
        working-directory: examples/hello

      - name: Verify tag matches package version
        run: |
          deno eval '
            const tag = Deno.env.get("GITHUB_REF_NAME");
            const config = JSON.parse(await Deno.readTextFile("deno.json"));
            if (tag !== `v${config.version}`) {
              throw new Error(`Tag ${tag} does not match package version v${config.version}`);
            }
          '

      - name: Publish package
        run: deno publish
