name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - deno_version: v2.1.x
            label: minimum Deno 2.1
          - deno_version: latest
            label: latest stable Deno
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ matrix.deno_version }}
          cache: true

      - name: Install locked dependencies
        run: deno install --frozen

      - name: Check package and documentation
        run: deno task check

  package:
    name: Package and performance readiness
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up latest stable Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: latest
          cache: true

      - name: Install locked dependencies
        run: deno ci

      - name: Verify publish contents and JSR requirements
        run: deno publish --dry-run

      - name: Check broad performance budgets
        run: deno test bench/regression_budget.tsx

  consumer:
    name: Published-package consumer
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up latest stable Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: latest
          cache: true

      - name: Check published 0.1 runtime interoperability
        run: deno task test:interop

      - name: Install example dependencies
        run: deno ci
        working-directory: examples/hello

      - name: Check published-package example
        run: deno task check
        working-directory: examples/hello
