name: Production smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Check deployed documentation
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: latest

      - name: Check production pages and stylesheet
        env:
          SITE_URL: https://bastianplsfix-html.bs.deno.net
        run: |
          deno eval '
            const base = Deno.env.get("SITE_URL");
            if (!base) throw new Error("SITE_URL is not set");
            const { version } = JSON.parse(
              await Deno.readTextFile("deno.json"),
            );

            async function check() {
              const page = await fetch(`${base}/`, {
                signal: AbortSignal.timeout(7_000),
              });
              const body = await page.text();
              if (!page.ok) throw new Error(`Home page returned ${page.status}`);
              if (!page.headers.get("content-type")?.includes("text/html")) {
                throw new Error("Home page did not return HTML");
              }
              if (!body.includes("@bastianplsfix/html")) {
                throw new Error("Home page is missing the package name");
              }
              if (page.headers.get("x-html-version") !== version) {
                throw new Error("Documentation deployment version is stale");
              }

              const stylesheet = await fetch(`${base}/styles.css`, {
                signal: AbortSignal.timeout(7_000),
              });
              const css = await stylesheet.text();
              if (!stylesheet.ok) {
                throw new Error(`Stylesheet returned ${stylesheet.status}`);
              }
              if (!stylesheet.headers.get("content-type")?.includes("text/css")) {
                throw new Error("Stylesheet did not return CSS");
              }
              if (!css.includes("--bs-background-1")) {
                throw new Error("Stylesheet is missing the expected color tokens");
              }
            }

            let lastError;
            for (let attempt = 1; attempt <= 12; attempt++) {
              try {
                await check();
                console.log(`Production smoke test passed on attempt ${attempt}`);
                Deno.exit(0);
              } catch (error) {
                lastError = error;
                console.error(`Attempt ${attempt} failed:`, error);
                if (attempt < 12) {
                  await new Promise((resolve) => setTimeout(resolve, 10_000));
                }
              }
            }

            throw lastError;
          '
